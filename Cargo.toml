# SPDX-License-Identifier: AGPL-3.0-only
[workspace]
resolver = "2"
members = [
    "crates/dragnet-core",
    "crates/dragnet-dht",
    "crates/dragnet-meta",
    "crates/dragnet-store",
    "crates/dragnet-api",
    "crates/dragnet-engine",
    "bin/dragnetd",
    "bin/dragnet-tray",
    "bin/dragnet-sign",
    "bin/dragnet-app",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/LordOfTheMachines/dragnet"
authors = ["Mehmet Gilik (LordOfTheMachines) <gilikmehmet@gmail.com>"]

[workspace.dependencies]
# Ortak bağımlılıklar fazlarda buraya toplanacak (tokio, serde, tracing, ...).
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_bencode = "0.2"
thiserror = "2"
