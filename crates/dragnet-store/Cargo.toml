[package]
name = "dragnet-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dragnet-core = { path = "../dragnet-core" }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
# SQLite sürücüsü gömülü (bundled) — FTS5 dahil. Compile-time sorgu makrosu
# KULLANMIYORUZ (runtime query), böylece derleme DATABASE_URL gerektirmez.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }

[dev-dependencies]
tokio = { workspace = true }
