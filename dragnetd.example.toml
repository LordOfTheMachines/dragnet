# dragnetd örnek yapılandırması.
# Kullanım: bu dosyayı `dragnetd.toml` olarak kopyalayın ve düzenleyin.
# Ortam değişkeni ile de geçersiz kılınabilir, örn: DRAGNET_API_BIND=0.0.0.0:9000

# SQLite veritabanı dosyası (yoksa oluşturulur).
db_path = "dragnet.db"

# Arama API'sinin dinleyeceği adres. Güvenlik için varsayılan yereldir.
api_bind = "127.0.0.1:8080"

# API için opsiyonel bearer token. Ayarlanırsa /search ve /stats
# "Authorization: Bearer <token>" başlığı ister. Yorumda bırakılırsa auth kapalı.
# api_token = "degistir-beni"

# DHT harvester UDP portu (varsayılan 6881; doluysa efemer porta düşer; 0 = doğrudan efemer).
# Sabit + yönlendirilmiş (port-forward) bir port pasif hasadı artırır.
harvester_port = 6881

# Harvester'ın saniyedeki azami giden DHT sorgusu.
# !!! İnternetin yavaşlıyor/kilitleniyorsa bu değeri DÜŞÜR (örn. 20-30). !!!
# Yüksek değerler ev router'larının bağlantı-izleme tablosunu doldurabilir.
# Port-forward + iyi bağlantıda 150-300'e çıkarılabilir.
harvester_max_queries_per_sec = 50

# Aynı anda metadata çekilecek azami infohash sayısı (fetcher havuzu boyutu).
# Çekimler çoğunlukla ağ beklemesidir; 12 makul. Toplam eşzamanlı TCP ≈ fetch_workers × fetch_peer_concurrency.
fetch_workers = 12

# Tek bir metadata çekiminde denenecek eşzamanlı peer sayısı.
fetch_peer_concurrency = 12

# Başlangıçta çekilip indekslenecek infohash'ler (indeksi ısıtmak / test için).
# seed_infohashes = ["08ada5a7a6183aae1e09d831df6748d566095a10"]  # Sintel

# --- Semantik (anlamsal) arama — Faz D, opt-in ---
# Açıksa yerel embedding modeli bir kez indirilir (HuggingFace), sonrası tamamen
# çevrimdışıdır; /search varsayılan olarak hibrit (FTS + semantik) çalışır.
# `mode=fts|semantic|hybrid` sorgu parametresiyle istemci modu zorlayabilir.
semantic_enabled = false
# Kademe: "light" (potion, statik, çok hızlı) | "balanced" (MiniLM int8) | "quality" (EmbeddingGemma Q4)
semantic_tier = "quality"
# Cihaz: "auto" (Windows'ta DirectML varsa GPU) | "gpu" | "cpu"
semantic_device = "auto"
# Model dizini — KISA/düz bir yol tut (ORT çok uzun yolları reddedebiliyor).
semantic_models_dir = "models"
# Cross-encoder yeniden sıralayıcı (bge-reranker-v2-m3, ~570 MB, CPU): daha isabetli, +~0.25 s/sorgu
semantic_rerank = true
